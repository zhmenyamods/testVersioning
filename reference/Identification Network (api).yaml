  /api/v1/market-contract-codes/:
    get:
      operationId: market_contract_codes_list
      description: >

        Returns all market contract codes that the user has access to.


        Attributes that control access:


        - User - single user that represents the owner of the contract code. The
        owner of a contract code

        can view, update, and delete the contract code.

        - Users - array of users that represent users that have been assigned
        view access to the contract code.

        - Access structures - array of structures that represent the structures
        that a user must belong to,

        in order to view the contract code.

        - If user, users, and access structures are all null or empty, the
        contract code has no access restrictions.


        Access restrictions:


        - If the request user is an admin, all contract codes under the user's
        database scope will be available to view.

        - If the request user is not an admin, the user can only view codes
        where the user is the owner of the contract code,

        the user is part of code's specific users or access structures, or the
        code has no access restrictions.
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - market-contract-codes
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarketContractCodeDetailList'
          description: Successfully received all configured contract codes
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
    post:
      operationId: market_contract_codes_create
      description: >

        Creates a market contract code.


        Attributes that control access:


        - User - single user that represents the owner of the contract code. The
        owner of a contract code

        can view, update, and delete the contract code.

        - Users - array of users that represent users that have been assigned
        view access to the contract code.

        - Access structures - array of structures that represent the structures
        that a user must belong to,

        in order to view the contract code.

        - If user, users, and access structures are all null or empty, the
        contract code has no access restrictions.


        Permissions:


        - An admin user can set any attributes on a contract code.

        - A non-admin user cannot set access structures or specific users on a
        contract code.

        - A non-admin user can set the owner on a contract code, but the owner
        must be its own user.
      tags:
        - market-contract-codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketContractCodeCreateRequest'
            examples:
              ContractCodeForAllStructures:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: null
                  users: []
                  accessStructures: []
                summary: Contract code for all structures
                description: >-
                  If key "accessStructures" is empty list, that means the
                  contract code is available for all structures under the
                  tenant. Only admin users can set access structures for a
                  contract code.
              ContractCodeForSpecificStructures:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: null
                  users: []
                  accessStructures:
                    - agency: 15a11c06-7679-453e-b965-54b97ae9e741
                      branch: 502b2c78-4b59-4142-9232-3b05ea1cec76
                      department: 2b25151e-2bae-4bcf-8bc9-885d4bfd23b1
                      businessUnit: 75d67c23-bb71-462e-ab77-32b4057880fe
                summary: Contract code for specific structures
                description: >-
                  Only admin users can set specific structures on a contract
                  code.
              ContractCodeOwnedByAUser:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: 00448c2f-0c06-4358-850c-85267d9be435
                  users: []
                  accessStructures: []
                summary: Contract code owned by a user
                description: >-
                  Admin users can set the owner of a contract code to any user.
                  Non-admin users can only set themselves as the owner.
              ContractCodeForSpecificUsers:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: null
                  users:
                    - 00448c2f-0c06-4358-850c-85267d9be435
                    - 15a11c06-7679-453e-b965-54b97ae9e741
                  accessStructures: []
                summary: Contract code for specific users
                description: >-
                  Admin users can assign contract codes to multiple specific
                  users. Non-admin users cannot set the users attribute.
              ContractSub-code:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Sub-Code
                  code: DEF456
                  codeType: 1
                  parent: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  user: null
                  users: []
                  accessStructures: []
                summary: Contract sub-code
                description: >-
                  Specify "parent" contract code UUID to set a code as a
                  sub-code.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarketContractCodeCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarketContractCodeCreateRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
