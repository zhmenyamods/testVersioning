          type: array
          items:
            type: integer
        naicsIndexes:
          type: array
          items:
            type: integer
        classCodeFilterRpas:
          type: array
          items:
            type: integer
      required:
        - attribute
        - createdAt
        - id
        - updatedAt
        - uuid
