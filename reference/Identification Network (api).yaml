              schema:
                $ref: '#/components/schemas/MarketContractCodeDetail'
          description: Successfully updated.
        '400':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/market_contract_code_update_responses_body
          description: Invalid request body (possible bad requests below).
        '401':
          content:
            application/json:
              schema:
