                        subdivision: string
                        licenseStatus: string
                        residentStatus: string
                        expirationDate: YYYY-MM-DD
                        agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agencyLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agentLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
