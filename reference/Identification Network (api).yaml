  /api/v1/classification-standards/{external_id}/import-codes/:
    post:
      operationId: classification_standards_import_codes_create
      description: >-
        Parses the class codes csv import for a specified class standard.


        User must have special permission to import.


        Columns for the csv are:

        - CODE

        - DESCRIPTION

        - INDEX CODE

        - INDEX DESCRIPTION

        - STATE(S)

        - RELATED CODES

        - RELATED CODES+DESCRIPTIONS


        To Import:

        - set externalId to an unused classification standard with no associated
        codes

        - import a csv with codes; these can be used as related codes.


        To use previous imported standard as related codes:

        - set externalId to another unused classification standard

        - set relatedCodeStandard to the externalId of a previous import that
        contains related codes.

        - if relatedCodeStandard is not set, RELATED CODES WILL BE IGNORED.

        - Related codes MUST ALL COME FROM THE SAME STANDARD.

        - import another csv for codes that will use the previously uploaded
        codes as related codes.


        There are two columns used to designate related codes:

        - enter related codes in the RELATED CODES column if all the related
        codes are unique for the standard

        - otherwise, use the code|description format in RELATED
        CODES+DESCRIPTIONS column.

        If any codes are entered in the RELATED CODES, parser will ignore
        RELATED CODES+DESCRIPTION.
      parameters:
        - in: path
          name: external_id
          schema:
            type: string
          required: true
      tags:
        - internal-classification-standards
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassificationCodeImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/classCodeMappingFile'
          description: Successfully created
        '400':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/classification_standard_import_invalid_body_request
          description: Invalid csv format or invalid file
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '404':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/classification_standard_import_available_responses
          description: '`externalId` does not have corresponding classification standard.'
        '500':
          description: >-
            Something wrong with the data type of the spreadsheet or internal
            server error
  /api/v1/condition-sets/import/:
    post:
      operationId: condition_sets_import_create
      description: >

        Imports from a user cloud file (CSV) to create Condition Sets and
        Conditions in IDNET.


        Intended for internal use to speed up Condition Set creation for carrier
        implementations.


        Requires specific Condition Set import permission to use.


        Minimum required Condition Set fields (supported via mapping from column
        header to field):

        name, operator


        Other Condition Set fields can be optionally included in the file and
        the mapping as well:

        Ex. riskProfileAttributeId, conditionSetId (for a parent condition set),
        message, appetite_type, etc.


        Minimum required condition fields (supported via mapping from column
        header to field):

        operator, source_attribute_id, str_value, num_value


        Other Condition fields can be optionally included in the file and the
        mapping as well:

        Ex. source_value_modifier, child_groups_only, etc.


        Condition fields that are automatically set: conditionSetId (matched on
        Condition Set name)
      tags:
        - internal-condition-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionSetImportRequest'
            examples:
              BasicImport:
                value:
                  userCloudFile: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  conditionSetFieldToHeadersMap:
                    name: Condition Set Name
                    operator: Condition Set Operator
                    riskProfileAttributeId: Condition Set RPA
                  conditionFieldToHeadersMap:
                    sourceAttributeId: Condition Source RPA
                    operator: Condition Operator
                    strValue: Condition String Value
                    numValue: Condition Number Value
                summary: Basic Import
                description: >-
                  Provide user_cloud_file and mapping dictionaries for Condition
                  Sets and Conditions
              ConditionSetOnlyImport:
                value:
                  userCloudFile: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  conditionSetFieldToHeadersMap:
                    name: Condition Set Name
                    operator: Condition Set Operator
                    riskProfileAttributeId: Condition Set RPA
                summary: Condition Set Only Import
                description: >

                  Provide user_cloud_file and mapping dictionary for Condition
                  Set(s) only.


                  NOTE: If a mapping dictionary is provided for Conditions, the
                  import process will try and

                  find conditions in the file and fail if they aren't there.
              ImportWithParentConditionSet(s):
                value:
                  userCloudFile: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  conditionSetFieldToHeadersMap:
                    name: Condition Set Name
                    operator: Condition Set Operator
                    conditionSetId: Parent Condition Set ID
                  conditionFieldToHeadersMap:
                    sourceAttributeId: Condition Source RPA
                    operator: Condition Operator
                    strValue: Condition String Value
                    numValue: Condition Number Value
                summary: Import with Parent Condition Set(s)
                description: >

                  Provide user_cloud_file and mapping dictionaries for Condition
                  Sets and Conditions.


                  Intended to be used when Parent Condition Set(s) have been
                  created ahead of time.

                  (See previous example)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConditionSetImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConditionSetImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidRequest,ImportPerformedSuccessfully:
                  value:
                    message: Created X Condition Set(s) and X Condition(s)
                    newConditionSets:
                      - id: 1
                        name: string
                        conditionSetId: 2
                        operator: string
                        repeatingGroupScope: null
                        action: null
                        message: string
                        conditions:
                          - attribute: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                            sourceGroup: null
                            sourceValueModifier: null
                            operator: string
                            value: 0
                            repeatingOperator: null
                            childGroupsOnly: null
                          - attribute: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                            sourceGroup: null
                            sourceValueModifier: null
                            operator: string
                            value: 1
                            repeatingOperator: null
                            childGroupsOnly: null
                  summary: Valid request, import performed successfully
          description: >-
            Successfully imported Condition Sets and Conditions from the
            specified file
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidImportParameters:
                  value:
                    userCloudFile:
                      - >-
                        Invalid pk "{BAD USER CLOUD FILE ID}" - object does not
                        exist.
                  summary: Invalid import parameters
                InvalidRowInImportFile:
                  value:
                    detail: >-
                      Error saving Condition on row 3: {'operator': ["Value
                      '{INVALID OPERATOR}' is not a valid choice."]}.
                  summary: Invalid row in import file
          description: Unable to perform import process
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/condition_set_import'
          description: You do not have permission to perform this action
  /api/v1/enhanced-appetite/:
    post:
      operationId: enhanced_appetite_create
      description: |2

            Returns enhanced appetite result and optional form.

            Enhanced appetite result has status for each requested combination of markets, lobs, and states.
            - If no markets are requested, appetite status is returned for all allowed markets.
            - If no states are requested, appetite status is returned for all US states.

            Optional form contains:
            - basic appetite fields
