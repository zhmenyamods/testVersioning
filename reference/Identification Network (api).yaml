  /api/v1/carrier-ico/import/:
    post:
      operationId: carrier_ico_import_create
      description: |2

            • IDNET internal purpose of importing LIFE, HEALTH, PROPERTY & CASUALTY, and GPAL spreadsheets
            • GPAL creates carriers and markets; all carriers have a unique group code
            • PROPERTY & CASUALTY, LIFE, HEALTH files create ICOs that work under the carrier
            • Address information and Carriers (Markets).
            • First, GPAL should be imported because other spreadsheets ICOs depend on the carriers
                with unique group codes.
            • File formats are different for GPAL and LIFE, HEALTH, PROPERTY & CASUALTY,
                but in case the UUID column is added to the end of the row,
                Market uuids will be updated accordingly
            • Request params:
                - type:
                    choices (Property & Casualty, HEALTH, LIFE, GPAL)
                - ico_file:
                    csv(utf-8) or csv(cp1252)
                - dry_run:
                    set to true for a preview of records that will be created/updated/deleted
                    without actually performing the operations
            • Authentication, user must have special auth to import.
      tags:
        - internal-carrier-ico
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CarrierICOImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/carrier_ico_import'
          description: Successfully created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/carrier_ico_import_invalid_body_request'
          description: Invalid csv format or invalid file
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '500':
          description: >-
            Something wrong with the data type of the spreadsheet or internal
            server error
  /api/v1/classification-codes/:
    post:
      operationId: classification_codes_create
      description: >-
        Returns corresponding classification codes for a given classification
        standard, based on

        an optional NAICS index, state, and/or search term.


        Note: A maximum of 100 class codes can be returned based on provided
        search and filters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: A page number within the paginated result set.
        - in: query
          name: page_size
          schema:
            type: integer
          description: Number of results to return per page.
      tags:
        - classification-codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationCodeSearchRequest'
            examples:
              StandardExample:
                value:
                  classificationStandard: 759e39fd-26e8-4be4-bfa5-e0b4fb73ead2
                  filterFieldValues:
                    - questionId: f23c0847-1fce-4627-8744-b69bfdfa7b47
                      value: 24a5298c-9747-442b-8b3d-58587ee5fc08
                    - questionId: 3dcdd8fa-60f0-4352-b464-d444d91aa947
                      value: IL
                  search: '109'
                summary: Standard example
                description: >-
                  The most common scenario is to send a request with
                  classificationStandard, filterFieldValues, and search. The key
                  "classificationStandard" accepts a UUID of a classification
                  standard record. The key "filterFieldValues" is a list of
                  dictionaries, in which questionId is the UUID of a form field
                  and value is the answer to the field. These fields should
                  correspond to either NAICS index or state fields, and will be
                  used to filter the matching classification codes. The key
                  "search" is a string that can be used to match the code or
                  description of the codes.
              EmptyFilterFieldValues:
                value:
                  classificationStandard: 759e39fd-26e8-4be4-bfa5-e0b4fb73ead2
                  filterFieldValues: []
                  search: '109'
                summary: Empty filterFieldValues
                description: >-
                  If "filterFieldValues" is empty, the resulting classification
                  codes will not be filtered by NAICS or state.
              ExcludeSearch:
                value:
                  classificationStandard: 759e39fd-26e8-4be4-bfa5-e0b4fb73ead2
                  filterFieldValues:
                    - questionId: f23c0847-1fce-4627-8744-b69bfdfa7b47
                      value: 24a5298c-9747-442b-8b3d-58587ee5fc08
                    - questionId: 3dcdd8fa-60f0-4352-b464-d444d91aa947
                      value: IL
                summary: Exclude search
                description: >-
