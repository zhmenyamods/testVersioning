  /api/v1/market-contract-codes/{uuid}/:
    get:
      operationId: market_contract_codes_retrieve
      description: >

        Returns an individual contract code.


        Attributes that control access:


        - User - single user that represents the owner of the contract code. The
        owner of a contract code

        can view, update, and delete the contract code.

        - Users - array of users that represent users that have been assigned
        view access to the contract code.

        - Access structures - array of structures that represent the structures
        that a user must belong to,

        in order to view the contract code.

        - If user, users, and access structures are all null or empty, the
        contract code has no access restrictions.


        Access restrictions:


        - If the request user is an admin, all contract codes under the user's
        database scope will be available to view.

        - If the request user is not an admin, the user can only view codes
        where the user is the owner of the contract code,

        the user is part of code's specific users or access structures, or the
        code has no access restrictions.
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - market-contract-codes
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketContractCodeDetail'
          description: Successfully received contract code.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '404':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/market_configuration_contract_code_detail_responses
          description: UUID is not valid or user does not have access to it.
    patch:
      operationId: market_contract_codes_partial_update
      description: >

        Updates an existing market contract code.


        Attributes that control access:


        - User - single user that represents the owner of the contract code. The
        owner of a contract code

        can view, update, and delete the contract code.

        - Users - array of users that represent users that have been assigned
        view access to the contract code.

        - Access structures - array of structures that represent the structures
        that a user must belong to,

        in order to view the contract code.

        - If user, users, and access structures are all null or empty, the
        contract code has no access restrictions.


        Access restrictions:


        - If the request user is an admin, all contract codes under the user's
        database scope will be available to update.

        - If the request user is not an admin, the user can only update codes
        where the user is the owner of the contract code.


        Permissions:


        - An admin user can set any attributes on a contract code.

        - A non-admin user cannot set access structures or specific users on a
        contract code, and cannot change the owner

        of the contract code to another user.
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - market-contract-codes
      requestBody:
        content:
          application/json:
