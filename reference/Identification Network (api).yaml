    RiskProfileCreateUpdate:
      type: object
      description: |-
        Used by internal team to perform CRUD operations on RiskProfiles

        ViewSet: RiskProfileViewSet

        Endpoints: GET /risk-profiles/
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 128
        description:
          type: string
        versionLog:
          type: string
          description: Log of changes made to create this risk profile version.
        type:
          allOf:
            - $ref: '#/components/schemas/TypeEnum'
          description: >-
            Type of risk profile. Base represents a base question set with a
            line of business. Monoline represents a carrier question set with a
            product and route configuration. Package represents a carrier
            question set with a product, route configuration, and related risk
            profile children. Bundle represents a carrier question set with a
            market and related risk profile children.
        isExcessAndSurplus:
          type: boolean
          description: Indicates whether the risk profile is for excess and surplus lines.
        akProductId:
          type: string
          description: >-
            Ask Kodiak product ID. If filled in, basic appetite for this risk
            profile will be retrieved from Ask Kodiak.
          maxLength: 32
        version:
          type: integer
          readOnly: true
          nullable: true
          description: >-
            Version number for a risk profile. A newly created risk profile's
            version is null, and will be set automatically when the risk profile
            is locked. The version number starts at 1 and increments by 1 based
            on existing risk profiles with matching market, line of business,
            product, route, and children.
        locked:
          type: boolean
          readOnly: true
          description: >-
            Indicates whether the risk profile and related RPAs and condition
            sets are locked for editing. Set this via admin action on the list
            page (subject to permission).
        isAvailable:
          type: boolean
          readOnly: true
          description: >-
            Indicates whether the risk profile has no issues after testing and
            is available to quote from. Set this via admin action on the list
            page (subject to permission).
        isLatest:
          type: boolean
          readOnly: true
          description: >-
            Indicates whether this risk profile is the latest version. For
            bookkeeping purposes only - not used for business logic.Set this via
            admin action on the list page (subject to permission).
        translationVersionId:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: >-
            Indicates which carrier translation version is to be used with this
            Risk Profile
        market:
          type: integer
          nullable: true
          description: >-
            Market associated with a bundle risk profile. Do not set this if
            product or line of business is set
        lineOfBusiness:
          type: integer
          nullable: true
          description: >-
            Line of business associated with a base risk profile. Do not set
            this if product or market is set.
        product:
          type: integer
          nullable: true
          description: >-
            Product (market and line of business) associated with a monoline or
            package risk profile. Do not set this if line of business or market
            is set.
        routeConfiguration:
          type: integer
          nullable: true
          description: >-
            Route associated with a monoline, bundle, or package risk profile.
            Set this if market or product is set.
        riskProfileAttributes:
          type: array
          items:
            type: integer
        riskProfileRepeatableFormGroups:
          type: array
          items:
            type: integer
        actionConditionSets:
          type: array
          items:
            type: integer
        children:
          type: array
          items:
            type: integer
          readOnly: true
          description: >-
            Children Risk Profiles will be combined into a single form
            definition and submission for carriers that support it.
      required:
        - children
        - createdAt
        - id
        - isAvailable
        - isLatest
        - locked
        - name
        - updatedAt
        - uuid
        - version
