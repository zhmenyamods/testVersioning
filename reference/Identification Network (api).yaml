            definition. Use list format (e.g.
            ["07420_50","07520_50","07521_50",...])
        classificationCodesExclude:
          type: boolean
          description: >-
            If true, RPAs associated with the class codes in
            classification_codes_str_value will be excluded, rather than
            included, from the form definition.
        context:
          type: string
          description: >-
            Internal notes that describe this RPA - why it was created, what RPA
            it replaces, etc.
        isBind:
          type: boolean
          description: If true, this RPA represents a question used to bind a quote.
        isRefer:
          type: boolean
          description: If true, this RPA represents a question used to refer a quote.
        hasAdditionalDetails:
          type: boolean
          description: >-
            If true, this RPA has additional details related to it. This field
            is refreshed when saving the RPA and importing additional details;
            it is not intended to be set manually. The value is used to avoid an
            unnecessary query of related additional details when determining
            whether the RPA has overrides.
        conditionSet:
          type: integer
          nullable: true
