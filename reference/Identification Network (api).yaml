                      branch: 502b2c78-4b59-4142-9232-3b05ea1cec76
                      department: 2b25151e-2bae-4bcf-8bc9-885d4bfd23b1
                      businessUnit: 75d67c23-bb71-462e-ab77-32b4057880fe
                  appointed: true
                  preferred: true
                  notes: Market specific notes
                  agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                summary: Standard example
                description: >-
                  All keys are optional. Key "linesOfBusiness" accepts UUIDs.
                  Key "accessStructures" accepts list of dictionary of UUIDs.
              MarketForAllStructures:
                value:
                  linesOfBusiness:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  accessStructures: []
                  appointed: true
                  preferred: true
                  notes: Market specific notes
                  agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                summary: Market for all structures
                description: >-
                  If key "accessStructures" is empty list, that means the market
                  is available for all structures under the tenant.
