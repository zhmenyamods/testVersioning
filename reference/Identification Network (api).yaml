              $ref: '#/components/schemas/PatchedMarketContractCodeCreateRequest'
            examples:
              UpdateNon-accessAttributesForContractCode:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                summary: Update non-access attributes for contract code
                description: >-
                  Admin users can update contract codes without user/structure
                  info in the request body. Any or all of the attributes can be
                  updated. Non-admin users can update if they own the contract
                  code.
              ContractCodeForAllStructures:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: null
                  users: []
                  accessStructures: []
                summary: Contract code for all structures
                description: >-
                  If key "accessStructures" is empty list, that means the
                  contract code is available for all structures under the
                  tenant. Only admin users can set access structures for a
                  contract code.
              ContractCodeForSpecificStructures:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: null
                  users: []
                  accessStructures:
                    - agency: 15a11c06-7679-453e-b965-54b97ae9e741
                      branch: 502b2c78-4b59-4142-9232-3b05ea1cec76
                      department: 2b25151e-2bae-4bcf-8bc9-885d4bfd23b1
                      businessUnit: 75d67c23-bb71-462e-ab77-32b4057880fe
                summary: Contract code for specific structures
                description: >-
                  Only admin users can set specific structures on a contract
                  code.
              ContractCodeOwnedByAUser:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: 00448c2f-0c06-4358-850c-85267d9be435
                  users: []
                  accessStructures: []
                summary: Contract code owned by a user
                description: >-
                  Admin users can set the owner of a contract code to any user.
                  Non-admin users can only set themselves as the owner.
              ContractCodeForSpecificUsers:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Code
                  code: ABC123
                  codeType: 1
                  user: null
                  users:
                    - 00448c2f-0c06-4358-850c-85267d9be435
                    - 15a11c06-7679-453e-b965-54b97ae9e741
                  accessStructures: []
                summary: Contract code for specific users
                description: >-
                  Admin users can assign contract codes to multiple specific
                  users. Non-admin users cannot set the users attribute.
              ContractSub-code:
                value:
                  marketConfiguration: b822ed9b-16cd-4738-beed-c0d9d7f74f24
                  nickname: Test Contract Sub-Code
                  code: DEF456
                  codeType: 1
                  parent: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  user: null
                  users: []
                  accessStructures: []
                summary: Contract sub-code
                description: >-
                  Specify "parent" contract code UUID to set a code as a
                  sub-code.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMarketContractCodeCreateRequest'
