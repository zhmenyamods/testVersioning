openapi: 3.0.3
info:
  title: Identification Network
  version: 1.0.0 (api)
  description: IVANS Identification Network API
paths:
  /api/v1/addresses/import/:
    post:
      operationId: addresses_import_create
      description: |2-

            Imports addresses from csv file
            - creates new addresses
            - skips if addresses already exist with the same address_1, city, state, zip code, and address_type

            - User must have specific permission to import addresses.
            - Expected CSV headers: address_1, address_2, city, state, zip_code, phone_1, phone_2,
            address_type, carrier_id, ico_id, broker_id
            - Values are required for headers: address_1, address_type
            
      tags:
        - internal-addresses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/address_import'
          description: Successfully created.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidCSVFile:
                  value:
                    detail:
                      - 'Invalid csv encoding type: utf-8-sig or cp1252 expected'
                  summary: Invalid CSV file
                InvalidCSVHeaders:
                  value:
                    detail:
                      - >-
                        Invalid column headers. Expected headers: [{headers
                        list}]
                  summary: Invalid CSV headers
                InvalidCSVData:
                  value:
                    detail:
                      - 'Missing required field: {header name} in row(s): 4, 5.'
                  summary: Invalid CSV data
          description: Invalid import file or data
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/address_import_responses_forbidden'
          description: You do not have permission to perform this action
  /api/v1/agencies/:
    get:
      operationId: agencies_list
      description: >

        Returns agencies that are accessible to the user.


        Access restrictions:


        - Service level users can retrieve any agency, agent, and license under
        their integrated application.

        - Admin users can retrieve their own agency, and any agent or license
        under their agency.

        - Non-admin users can retrieve their own active agency, their own active
        agent, and active licenses where

        they or their agency are the licensee, or where they are granted access.
      parameters:
        - in: query
          name: external_id
          schema:
            type: string
          description: Filter by agency external ID (exact match)
        - in: query
          name: include_agent_info
          schema:
            type: boolean
            default: false
          description: Include agent information in the response
        - in: query
          name: include_license_info
          schema:
            type: boolean
            default: false
          description: Include license information in the response
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter by agency's active status
        - in: query
          name: npn
          schema:
            type: string
          description: Filter by agency NPN (exact match)
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: test_mode
          schema:
            type: boolean
          description: Filter by agency's test mode status
      tags:
        - agencies
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DoNotIncludeAgentAndLicenseInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        externalId: string
                        npn: string
                        name: string
                        isActive: true
                        testMode: false
                  summary: Do not include agent and license info
                IncludeAgentInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        externalId: string
                        npn: string
                        name: string
                        isActive: true
                        testMode: false
                        agents:
                          - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            externalId: string
                            agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            npn: string
                            firstName: string
                            middleName: string
                            lastName: string
                            email: user@example.com
                            isActive: true
                            isAdmin: true
                            isProducer: true
                  summary: Include agent info
                IncludeLicenseInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        externalId: string
                        npn: string
                        name: string
                        isActive: true
                        testMode: false
                        licenses:
                          - uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            licenseNumber: string
                            type: string
                            subdivision: string
                            licenseStatus: string
                            residentStatus: string
                            expirationDate: YYYY-MM-DD
                            agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            agencyLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            agentLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            agentsGrantedAccess:
                              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  summary: Include license info
                IncludeAgentAndLicenseInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        externalId: string
                        npn: string
                        name: string
                        isActive: true
                        testMode: false
                        agents:
                          - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            externalId: string
                            agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            npn: string
                            firstName: string
                            middleName: string
                            lastName: string
                            email: user@example.com
                            isActive: true
                            isAdmin: true
                            isProducer: true
                        licenses:
                          - uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            licenseNumber: string
                            type: string
                            subdivision: string
                            licenseStatus: string
                            residentStatus: string
                            expirationDate: YYYY-MM-DD
                            agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            agencyLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            agentLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                            agentsGrantedAccess:
                              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  summary: Include agent and license info
          description: Successfully retrieved agencies
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotAuthorizedForIntegratedApplication:
                  value:
                    detail: >-
                      User is not authorized for the given integrated
                      application.
                  summary: Not authorized for integrated application
          description: Retrieval errored due to bad request
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agency_list'
          description: Retrieval errored due to lack of permission
    post:
      operationId: agencies_create
      description: >

        Creates a new agency.


        Access restrictions:


        - Only service level users can use this endpoint to register an agency.

        - Only service level users can set the test mode on an agency.

        - Non-service level users must use the PUT endpoint instead to register
        an agency.
      tags:
        - agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyTenantWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyTenantWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyTenantWriteRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DefaultResponse:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    externalId: string
                    npn: string
                    name: string
                    isActive: true
                    testMode: false
                  summary: Default response
          description: Successfully created an agency
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotAuthorizedForIntegratedApplication:
                  value:
                    detail: >-
                      User is not authorized for the given integrated
                      application.
                  summary: Not authorized for integrated application
                Non-serviceLevelUserCannotPOST:
                  value:
                    detail: >-
                      Tenant data already exists for your integrated
                      application. Use the PUT endpoint to register agency
                      information on existing tenants.
                  summary: Non-service level user cannot POST
                DuplicateExternalID:
                  value:
                    externalId: Agency with this external ID already exists.
                  summary: Duplicate external ID
          description: Creation errored due to bad request
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agency_create'
          description: Creation errored due to lack of permission
