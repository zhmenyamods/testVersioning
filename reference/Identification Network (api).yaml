          description: Successfully created.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidCSVFile:
                  value:
                    detail:
                      - 'Invalid csv encoding type: utf-8-sig or cp1252 expected'
                  summary: Invalid CSV file
                InvalidCSVHeaders:
                  value:
                    detail:
                      - >-
                        Invalid column headers. Expected headers: ['carrier_id',
                        'nickname', 'code', 'y_account_id', 'segments', 'icos',
                        'location', 'active', 'new_business',
                        'binding_authority', 'service_center',
                        'notes','last_modified_by_external_id']
                  summary: Invalid CSV headers
                InvalidCSVData:
                  value:
                    detail:
                      - >-
                        duplicate contract code key (carrier_id, code,
                        y_account_id) in row(s): 4, 5.
                  summary: Invalid CSV data
          description: Invalid import file or data
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/reg_company_code_import_responses_forbidden
          description: You do not have permission to perform this action
