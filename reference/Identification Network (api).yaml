  /api/v1/attributes/import/:
    post:
      operationId: attributes_import_create
      description: >

        Imports from a .csv file to create Attributes in IDNET, intended for
        internal use


        Requires a specific attribute import permission to use


        One field is required using an exact name:


        integrated_app_external_id: An external ID for referring to the
        attribute within an integrated application


        Minimum required Attribute fields (supported via mapping from column
        header to field):

        name, external_id (IVANS generated), form_group_id, data_type, order,
        ivans_id and ido_mapping

        Other Attribute fields can be optionally included in the file and the
        mapping as well:

        Ex. default_value, minimum, maximum, suggest_type, suggest_format, etc.
      tags:
        - internal-attributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeImportRequest'
            examples:
              BasicImport:
                value:
                  userCloudFile: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  integratedApplication: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  fieldToHeadersMap:
                    name: Question Name
                    externalId: External ID
                    formGroupId: Form ID
                    dataType: Data Format
                    order: Question Order
                    ivansId: IVANS ID
                    idoMapping: IDM Mapping
                summary: Basic Import
                description: >-
                  Provide user_cloud_file, integrated_application and mapping
                  dictionary
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidRequest,ImportPerformedSuccessfully:
                  value:
                    message: Created X Attribute(s)
                    newAttributes:
                      - guid: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                        group: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                        label: string
                        description: string
                        order: null
                        type: string
                        dataClass: string
                        options: []
                        unique: false
                        minimum: null
                        maximum: null
                        integratedAppExternalIds:
                          - integratedApplication: 0
                            externalId: string
                  summary: Valid request, import performed successfully
          description: Successfully imported attributes from the specified file
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                MissingRequiredFields:
                  value:
                    detail: >-
                      Missing required field(s): Row 2 missing:
                      integrated_app_external_id.
                  summary: Missing required fields
                InvalidImportParameters:
                  value:
                    userCloudFile:
                      - >-
                        Invalid pk "{BAD USER CLOUD FILE ID}" - object does not
                        exist.
                  summary: Invalid import parameters
          description: Unable to perform import process
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attributes_import'
          description: You do not have permission to perform this action
  /api/v1/basic-appetite/:
    post:
      operationId: basic_appetite_create
      description: |2

            Returns basic appetite result and optional form.

            Basic appetite result contains status for each combination of the requested markets, lobs, and states.
            - If no markets are requested, appetite status is returned for all allowed markets.
            - If no states are requested, appetite status is returned for all US states.

            Optional form contains:
            - basic appetite fields
            - enhanced appetite fields for risk profiles in appetite
            - list of risk profiles that passed basic appetite
      parameters:
        - in: query
          name: nested_form
          schema:
            type: boolean
          description: Format the returned form with nested pages, groups, and fields
        - in: query
          name: return_enhanced_form
          schema:
            type: boolean
          description: Return  the enhanced appetite form
      tags:
        - basic-appetite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicAppetiteRequest'
            examples:
              StandardExample:
                value:
                  lobs:
                    - BOP
                    - WORK
                  markets:
                    - 7eeb51e5-6e68-4ca9-b85f-661f31a157b0
                    - c780e6d1-e89e-4a5d-8942-d43536e39092
                  naicsIndex: e99fe5c4-01c8-433e-8e4a-d134a6a8a66e
                  states:
                    - AL
                    - AK
