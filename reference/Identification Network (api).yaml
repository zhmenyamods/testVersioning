    RiskProfile:
      type: object
      description: |-
        Used by internal team to perform CRUD operations on RiskProfiles

        ViewSet: RiskProfileViewSet

        Endpoints: GET /risk-profiles/
      properties:
        id:
          type: integer
          readOnly: true
        lineOfBusiness:
          $ref: '#/components/schemas/LineOfBusiness'
        product:
          $ref: '#/components/schemas/ProductReadOnly'
        routeConfiguration:
          $ref: '#/components/schemas/RouteConfigurationReadOnly'
        uuid:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 128
        description:
          type: string
        versionLog:
          type: string
          description: Log of changes made to create this risk profile version.
        type:
          allOf:
            - $ref: '#/components/schemas/TypeEnum'
          description: >-
            Type of risk profile. Base represents a base question set with a
            line of business. Monoline represents a carrier question set with a
            product and route configuration. Package represents a carrier
            question set with a product, route configuration, and related risk
            profile children. Bundle represents a carrier question set with a
            market and related risk profile children.
        isExcessAndSurplus:
          type: boolean
          description: Indicates whether the risk profile is for excess and surplus lines.
        akProductId:
          type: string
          description: >-
            Ask Kodiak product ID. If filled in, basic appetite for this risk
            profile will be retrieved from Ask Kodiak.
          maxLength: 32
        version:
          type: integer
          readOnly: true
          nullable: true
          description: >-
            Version number for a risk profile. A newly created risk profile's
            version is null, and will be set automatically when the risk profile
            is locked. The version number starts at 1 and increments by 1 based
            on existing risk profiles with matching market, line of business,
            product, route, and children.
        locked:
          type: boolean
          readOnly: true
          description: >-
            Indicates whether the risk profile and related RPAs and condition
            sets are locked for editing. Set this via admin action on the list
            page (subject to permission).
        isAvailable:
          type: boolean
          readOnly: true
          description: >-
            Indicates whether the risk profile has no issues after testing and
            is available to quote from. Set this via admin action on the list
            page (subject to permission).
        isLatest:
          type: boolean
          readOnly: true
          description: >-
            Indicates whether this risk profile is the latest version. For
            bookkeeping purposes only - not used for business logic.Set this via
            admin action on the list page (subject to permission).
        translationVersionId:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: >-
            Indicates which carrier translation version is to be used with this
            Risk Profile
        market:
          type: integer
          nullable: true
          description: >-
            Market associated with a bundle risk profile. Do not set this if
            product or line of business is set
        riskProfileAttributes:
          type: array
          items:
            type: integer
        riskProfileRepeatableFormGroups:
          type: array
          items:
            type: integer
        actionConditionSets:
          type: array
          items:
            type: integer
        children:
          type: array
          items:
            type: integer
          readOnly: true
          description: >-
            Children Risk Profiles will be combined into a single form
            definition and submission for carriers that support it.
      required:
        - children
        - createdAt
        - id
        - isAvailable
        - isLatest
        - lineOfBusiness
        - locked
        - name
        - product
        - routeConfiguration
        - updatedAt
        - uuid
        - version
    RiskProfileAttributeCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 128
        description:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        requirementLevel:
          allOf:
            - $ref: '#/components/schemas/RequirementLevelEnum'
          description: >-
            Determines whether the field is required, optional, or excluded from
            the form. Preferred means the field is excluded by default, but a
            value of an equivalent field (that is required/optional) from
            another risk profile can be injected into the submission. Internal
            means the field is not displayed by default and is used for internal
            purposes only, such as injecting mapped carrier class codes.
          minimum: -2147483648
          maximum: 2147483647
        classificationCodesStrValue:
          type: string
          description: >-
            List of custom class codes used to filter this RPA from the form
            definition. Use list format (e.g.
            ["07420_50","07520_50","07521_50",...])
        classificationCodesExclude:
          type: boolean
          description: >-
            If true, RPAs associated with the class codes in
            classification_codes_str_value will be excluded, rather than
            included, from the form definition.
        underwritingCategory:
          allOf:
            - $ref: '#/components/schemas/UnderwritingCategoryEnum'
          description: >-
            Basic Appetite - represents a question used to evaluate basic
            appetite (i.e. NAICS and state) for a quote. Eligibility Criteria -
            represents a question used to evaluate enhanced appetite for a
            quote. Ineligible Exposures - deprecated. Underwriting Guidelines -
            deprecated. Risk Information - represents a question specific to the
            business and class being quoted. Post-Quote - represents a follow-up
            question after the quote has been submitted and accepted, for the
            purpose of binding and/or referral, depending on whether 'Is Bind'
            and 'Is Refer' is true on this RPA.
          minimum: -2147483648
          maximum: 2147483647
        context:
          type: string
          description: >-
            Internal notes that describe this RPA - why it was created, what RPA
            it replaces, etc.
        isBind:
          type: boolean
          description: If true, this RPA represents a question used to bind a quote.
        isRefer:
          type: boolean
          description: If true, this RPA represents a question used to refer a quote.
        hasAdditionalDetails:
          type: boolean
          description: >-
            If true, this RPA has additional details related to it. This field
            is refreshed when saving the RPA and importing additional details;
            it is not intended to be set manually. The value is used to avoid an
            unnecessary query of related additional details when determining
            whether the RPA has overrides.
        product:
          type: integer
          nullable: true
        attribute:
          type: integer
        valueList:
          type: integer
          nullable: true
        conditionSet:
          type: integer
          nullable: true
          description: >-
            Determines whether the risk profile has an appetite for the data in
            this attribute. The integrator will combine the outcome of this
            condition set with requirement_level to determine whether the field
            is displayed or hidden.
        classificationCodesStandard:
          type: integer
          nullable: true
          description: >-
            The classification standard associated with the class codes used to
            filter this RPA.
        classificationStandard:
          type: integer
          nullable: true
        prefillSourceRpa:
          type: integer
          nullable: true
