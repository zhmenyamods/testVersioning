  /api/v1/risk-profile-attributes/import/:
    post:
      operationId: risk_profile_attributes_import_create
      description: |2

            Imports from a user cloud file (CSV) to create Risk Profile Attributes in IDNET.

            Intended for internal use to speed up RPA creation for carrier implementations.

            Requires specific RPA import permission to use.

            Most RPA fields are supported via mapping from header column to field.
            Required fields:
            attribute_id, data_class, requirement_level, underwriting_category
            Fields that have default value:
            data_class, requirement_level, underwriting_category
            Optional RPA fields:
            name, context, description, order, required, value_list_id, effective_date, expiration_date,
            classification_standard_id, classification_codes_str_value,
            classification_codes_standard_id, classification_codes_exclude

            RPA fields that are automatically set: product_id, risk_profiles

            To set related NAICS indexes on RPAs, include a column where the header is "naics_indexes"
            and the values are comma-separated UUIDs of NAICS indexes.

            RPA fields that are not supported: condition_set, class_code_filter_rpas, prefill_source_rpa,
            countries, subdivisions
      tags:
        - internal-risk-profile-attributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskProfileAttributeImportRequest'
            examples:
              BasicImport:
                value:
                  risk_profile: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  user_cloud_file: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  field_to_headers_map:
                    context: context
                    attributeId: attribute_id
                    valueListId: value_list_id
                    requirementLevel: requirement_level
                    underwritingCategory: underwriting_category
                    classificationStandardId: classification_standard_id
                    classificationCodesStrValue: classification_codes_str_value
                    classificationCodesStandardId: classification_codes_standard_id
                    classificationCodesExclude: classification_codes_exclude
                summary: Basic Import
                description: Provide user_cloud_file, risk_profile and mapping dictionary
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RiskProfileAttributeImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RiskProfileAttributeImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidRequest,ImportPerformedSuccessfully:
                  value:
                    message: Created X risk profile attributes.
                    newRpas:
                      - id: 0
                        underwritingCategory: string
                        attribute: string
                        product: string
                        requirementLevel: string
                        valueList:
                          dataType: string
                          values:
                            - label: string
                              value: 0
                          name: string
                          description: string
                        naicsIndexes:
                          - id: 0
                            description: string
                        subdivisions:
                          - id: 0
                            alpha2: st
                        classificationCodesStandard:
                          id: 0
                          name: string
                        uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        createdAt: '2023-04-18T16:37:38.152Z'
                        updatedAt: '2023-04-18T16:37:38.152Z'
                        name: string
                        description: string
                        order: 2147483647
                        effectiveDate: '2023-04-18'
                        expirationDate: '2023-04-18'
                        classificationCodesStrValue: string
                        classificationCodesExclude: true
                        context: string
                        conditionSet: 0
                        classificationStandard: 0
                        prefillSourceRpa: 0
                        classificationCodes:
                          - 0
                        classCodeFilterRpas:
                          - 0
                  summary: Valid request, import performed successfully
          description: Successfully imported RPAs from the specified file
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                MissingMappedFields:
                  value:
                    detail: >-
                      Value "{MAPPED COLUMN HEADER}" in mapping is not in file
                      header
                  summary: Missing mapped fields
                InvalidImportParameters:
                  value:
                    user_cloud_file:
                      - >-
                        Invalid pk "{BAD USER CLOUD FILE ID}" - object does not
                        exist.
                  summary: Invalid import parameters
                ValidationErrorWhileSaving:
                  value:
                    detail: >-
                      Error(s) encountered while saving RPA: {ROW NUMBER}:
                      {VALIDATION ERROR}.
                  summary: Validation error while saving
          description: Import errored due to bad request
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpas_import'
          description: You do not have permission to perform this action
