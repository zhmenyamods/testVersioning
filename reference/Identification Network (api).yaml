  /api/v1/utils/suggest/:
    post:
      operationId: utils_suggest_create
      description: >-
        Uses Marco Polo Synonym and Bumping services to suggest the best option
        for

        a given Attribute/RPA's value list
      tags:
        - utils
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
            examples:
              SynonymExample:
                value:
                  value: house
                  guid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quoteId: 3fa85f6457174562b3fc2c963f66afa6
                  mapFromGuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                summary: Synonym Example
                description: |2-

                          Find the best match for "house" out of "home", "apartment" and "condo"
                          
              CoverageBumpingExample:
                value:
                  value: 1,000,000/1,500,000/1,000,000
                  guid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quoteId: 3fa85f6457174562b3fc2c963f66afa6
                summary: Coverage Bumping Example
                description: |2-

                          Find the appropriate coverage amount
                          
              RegularBumpingExample:
                value:
                  value: 7
                  guid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quoteId: 3fa85f6457174562b3fc2c963f66afa6
                summary: Regular Bumping Example
                description: |2-

                          Find the appropriate amount
                          
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                SynonymSuccess:
                  value:
                    - label: Home
                      value: home
                      confidence: 1
                      synonym: home
                    - label: Home
                      value: home
                      confidence: 0.375
                      synonym: house
                    - label: Home
                      value: home
                      confidence: 0.2
                      synonym: menage
                  summary: Synonym Success
                  description: |2-

                                            • label - value list option label
                                            • value - value list option value
                                            • confidence - result of performing bi-gram fuzzy match
                                            • synonym - the synonym that was used to derive the confidence
                                            
                CoverageBumpingSuccess:
                  value:
                    - label: 1,000,000/2,000,000/1,000,000
                      value: 102010
                      confidence: null
                      synonym: null
                  summary: Coverage Bumping Success
                  description: |2-

                                            • label - value list option label
                                            • value - value list option value
                                            • confidence - N/A
                                            • synonym - N/A
                                            
                RegularBumpingSuccess:
                  value:
                    - label: 9 Months
                      value: 9
                      confidence: null
                      synonym: null
                  summary: Regular Bumping Success
                  description: |2-

                                            • label - value list option label
                                            • value - value list option value
                                            • confidence - N/A
                                            • synonym - N/A
                                            
          description: Found a successful match
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Attribute/RPACouldNotBeFound:
                  value:
                    detail: Not found.
                  summary: Attribute/RPA could not be found
          description: Failed to find a valid match
