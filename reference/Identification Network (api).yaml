        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this value list option mapping.
          required: true
      tags:
        - internal-value-list-option-mapping
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueListOptionMappingRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValueListOptionMappingRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValueListOptionMappingRequestRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueListOptionMapping'
          description: ''
  /api/v1/value-list-option-mapping/get-choices/:
    get:
      operationId: value_list_option_mapping_get_choices_list
      description: Returns possible value list options to be mapped
      parameters:
        - in: query
          name: risk_profile
          schema:
            type: string
            format: uuid
          required: true
        - in: query
          name: risk_profile_attribute
          schema:
            type: integer
          required: true
      tags:
        - internal-value-list-option-mapping
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValueListOptionMappingRPA'
          description: ''
  /api/v1/value-list-option-mapping/get-dropdowns-by-risk-profile/{risk_profile_uuid}/:
    get:
      operationId: value_list_option_mapping_get_dropdowns_by_risk_profile_retrieve
      description: Returns all RPAs with a Value List for a given Risk Profile
      parameters:
        - in: path
          name: risk_profile_uuid
          schema:
            type: string
          required: true
      tags:
        - internal-value-list-option-mapping
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueListOptionMappingRPA'
          description: ''
  /api/v1/value-list-option-mapping/get-mappings/:
    get:
      operationId: value_list_option_mapping_get_mappings_retrieve
      description: |-
        Returns existing mappings by rpa and value_list_option.
        A mapping object is created if one doesn't already exist.
      parameters:
        - in: query
          name: risk_profile_attribute
          schema:
            type: integer
          required: true
        - in: query
          name: value_list_option
          schema:
            type: integer
          required: true
      tags:
        - internal-value-list-option-mapping
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueListOptionMapping'
          description: ''
  /api/v1/value-lists/import/:
    post:
      operationId: value_lists_import_create
      description: |2

            Imports from a user cloud file (CSV) to create value lists and value list options in IDNET.

            Intended for internal use to speed up value list creation for carrier implementations.

            Requires specific value list import permission to use.

            Value list fields that are supported via mapping from header column to field:
            name, description, data_type

            Value list option fields that are supported via mapping from header column to field:
            name, order, int_value, str_value

            Value list option fields that are automatically set: value_list_id (matched on value list name)
      tags:
        - internal-value-lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueListImportRequest'
            examples:
              BasicImport:
                value:
                  userCloudFile: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                  valueListFieldToHeadersMap:
                    name: value_list_name
                    description: value_list_description
                    data_type: value_list_data_type
                  valueListOptionFieldToHeadersMap:
                    name: value_list_option_name
                    order: value_list_option_order
                    intValue: value_list_option_int_value
                    strValue: value_list_option_str_value
                summary: Basic Import
                description: Provide user_cloud_file and mapping dictionaries
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValueListImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValueListImportRequest'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidRequest,ImportPerformedSuccessfully:
                  value:
                    message: Created X value lists and X value list options.
                    newValueLists:
                      - dataType: string
                        values:
                          - label: string
                            value: 0
                        name: string
                        description: string
                  summary: Valid request, import performed successfully
          description: Successfully imported value lists from the specified file
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                MissingMappedFields:
                  value:
                    detail: >-
                      Value "{MAPPED COLUMN HEADER}" in mapping is not in file
                      header
                  summary: Missing mapped fields
                InvalidImportParameters:
                  value:
                    userCloudFile:
                      - >-
                        Invalid pk "{BAD USER CLOUD FILE ID}" - object does not
                        exist.
                  summary: Invalid import parameters
                ValueListValidationErrorWhileSaving:
                  value:
                    detail: >-
                      Error(s) encountered while saving value list: {VALUE LIST
                      NAME}: {VALIDATION ERROR}.
                  summary: Value list validation error while saving
                ValueListOptionValidationErrorWhileSaving:
                  value:
                    detail: >-
                      Error(s) encountered while saving value list: {ROW
                      NUMBER}: {VALIDATION ERROR}.
                  summary: Value list option validation error while saving
          description: Import errored due to bad request
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                      - tokenClass: AccessToken
                        tokenType: access
                        message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vl_import'
          description: You do not have permission to perform this action
