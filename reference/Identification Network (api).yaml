      description: >

        Returns list of templates and their default field values that are
        accessible to the user.


        Permissions:

        - All users can access templates owned by Ivans.

        - Service level users can access templates that are owned by their
        application or any agency under the application.

        - Agency level admin users can access templates owned by their
        application or their own agency.

        - Agency level non-admin users can access templates that are set to
        available, and are owned by their application

        or their own agency.


