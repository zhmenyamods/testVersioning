        - in: query
          name: agent_granted_access
          schema:
            type: string
          description: Filter by ID of an agent granted access (exact match)
        - in: query
          name: agent_licensee
          schema:
            type: string
          description: Filter by agent licensee ID (exact match)
        - in: query
          name: license_number
          schema:
            type: string
          description: Filter by license number (exact match)
        - in: query
          name: license_status
          schema:
            type: string
          description: Filter by license status (active, inactive, cancelled)
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: subdivision
          schema:
            type: string
          description: Filter by subdivision two-character code (exact match)
